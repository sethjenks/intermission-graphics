name: Isoline Player

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:player
      - uses: actions/upload-artifact@v4
        with:
          name: isoline-player-1.0.0
          path: dist/isoline-player-1.0.0.zip
          if-no-files-found: error

  ios-harness:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run build:ios-harness
